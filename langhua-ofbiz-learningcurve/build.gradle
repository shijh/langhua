/*
 * Third party libraries used by this component.
 * OFBiz fetches them from Maven Central and puts them on the component classpath.
 */
dependencies {
    // JAMA (Java Matrix Package) - official NIST release, provides the Jama package
    // replaces the unavailable legacy coordinate jama:matrix:1.0.2
    pluginLibsCompile 'gov.nist.math:jama:1.0.3'
}

zxing.services.test.status = true
zxing.services.test.message = THIS IS A TEST MESSAGE.

zxing.services.qrcode.default.width = 200
zxing.services.qrcode.default.height = 200
# default format to be used
zxing.services.qrcode.default.format = jpg
# formats the service may write; the code reads "formats", the same spelling as this key
zxing.services.qrcode.formats.supported = jpg|png

# The text is encoded as UTF-8 unless the caller says otherwise. zxing would use ISO-8859-1 by
# default, which turns a Chinese label message into question marks.
zxing.services.qrcode.default.encoding = UTF-8

# Error correction level: L (~7% of the code may be damaged), M, Q or H (~30%). The default keeps
# the codes as they were; H is what you want when a logo is drawn on top of the code.
zxing.services.qrcode.error.correction.level = L